name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read manifest version
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version from manifest.json: $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Stage release assets
        run: |
          mkdir -p release
          cp main.js manifest.json styles.css release/

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Release $VERSION already exists; updating assets"
              gh release upload "$VERSION" release/main.js release/manifest.json release/styles.css --clobber
            else
              echo "Release $VERSION already exists. Bump manifest.json to publish a new one."
              exit 0
            fi
          else
            gh release create "$VERSION" \
              release/main.js \
              release/manifest.json \
              release/styles.css \
              --target "${GITHUB_SHA}" \
              --title "$VERSION" \
              --generate-notes
          fi
          gh release edit "$VERSION" --title "$VERSION"
